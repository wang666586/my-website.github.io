<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>拍照搜题 · 文字题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- SheetJS 用于 Excel 导入导出 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: #f5f7fb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .app-card { max-width: 520px; width: 100%; background: #ffffff; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); padding: 24px 20px 32px; }
        h1 { font-size: 24px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        h1 i { color: #3b82f6; font-size: 26px; }
        .subhead { color: #64748b; font-size: 14px; margin-bottom: 24px; padding-left: 12px; border-left: 4px solid #3b82f6; background: #f8fafc; border-radius: 0 12px 12px 0; line-height: 1.4; padding: 8px 14px; }
        .upload-area { background: #f8fafc; border-radius: 24px; padding: 20px 16px; border: 1px dashed #d1d9e8; margin-bottom: 20px; text-align: center; }
        .upload-area i { font-size: 42px; color: #3b82f6; opacity: 0.7; margin-bottom: 6px; }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 12px 0 6px; }
        .upload-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #3b82f6; color: white; font-weight: 500; padding: 10px 22px; border-radius: 60px; font-size: 16px; box-shadow: 0 6px 14px rgba(59,130,246,0.25); cursor: pointer; border: none; flex: 1; min-width: 100px; }
        .upload-btn:active { transform: scale(0.96); }
        .upload-btn-outline { background: #eef2f6; color: #1e293b; box-shadow: none; }
        .upload-btn-outline i { color: #1e293b; }
        #file-input, #camera-input, #excel-input { display: none; }
        .file-name { font-size: 14px; color: #475569; margin-top: 10px; background: #ffffff; padding: 6px 14px; border-radius: 30px; display: inline-block; border: 1px solid #e9edf4; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .image-preview { margin-top: 16px; border-radius: 20px; overflow: hidden; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 80px; border: 1px solid #e2e8f0; }
        .image-preview img { max-width: 100%; max-height: 260px; display: block; }
        .action-row { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 80px; border: none; background: #eef2f6; padding: 14px 10px; border-radius: 60px; font-weight: 600; font-size: 15px; color: #1e293b; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; box-shadow: 0 8px 18px rgba(59,130,246,0.3); }
        .btn-primary:active { transform: scale(0.96); }
        .btn-success { background: #10b981; color: white; box-shadow: 0 8px 18px rgba(16,185,129,0.3); }
        .btn-outline { background: transparent; border: 1.5px solid #d1d9e8; }
        .btn-outline:active { background: #f1f5f9; }
        .btn-warning { background: #f59e0b; color: white; box-shadow: 0 8px 18px rgba(245,158,11,0.3); }
        .btn i { font-size: 18px; }
        .btn-purple { background: #8b5cf6; color: white; box-shadow: 0 8px 18px rgba(139,92,246,0.3); }
        .btn-purple:active { transform: scale(0.96); }
        .btn-pink { background: #ec4899; color: white; box-shadow: 0 8px 18px rgba(236,72,153,0.3); }
        .btn-pink:active { transform: scale(0.96); }
        .custom-section { background: #f9faff; border-radius: 20px; padding: 16px; margin: 12px 0; border: 1px solid #e9edf4; }
        .custom-section label { font-weight: 600; color: #1e293b; font-size: 15px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .custom-section label i { color: #3b82f6; }
        .custom-textarea { width: 100%; padding: 14px 16px; border-radius: 20px; border: 1.5px solid #dbe0ea; background: white; font-size: 15px; resize: vertical; min-height: 70px; transition: 0.2s; color: #0f172a; }
        .custom-textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .result-box { background: #f1f5f9; border-radius: 24px; padding: 18px; margin-top: 16px; border-left: 5px solid #3b82f6; }
        .result-box .label { font-size: 13px; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .result-box .label i { color: #3b82f6; }
        .status-badge { display: inline-block; font-size: 13px; padding: 2px 14px; border-radius: 30px; background: #e9edf4; color: #334155; }
        .footer-note { margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center; border-top: 1px solid #edf2f7; padding-top: 18px; }
        .badge-answer { background: #d1fae5; color: #065f46; margin-left: 8px; }
        .ocr-selector { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
        .ocr-selector label { font-size: 14px; color: #475569; display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .ocr-selector input[type="radio"] { accent-color: #3b82f6; width: 16px; height: 16px; }
        .auto-answer-badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 30px;
            background: #dbeafe;
            color: #1e4a8a;
            margin-left: 8px;
        }
        .answer-display {
            background: #ecfdf5;
            border-radius: 16px;
            padding: 16px 18px;
            border-left: 5px solid #10b981;
            margin-top: 4px;
        }
        .answer-display .answer-label {
            font-size: 14px;
            font-weight: 600;
            color: #065f46;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .answer-display .answer-label i {
            font-size: 18px;
        }
        .answer-display .answer-text {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .answer-display .question-ref {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #d1fae5;
            font-size: 13px;
            color: #64748b;
        }
        .answer-display .question-ref strong {
            color: #1e293b;
        }
        .placeholder-text {
            color: #94a3b8;
            font-style: italic;
            padding: 8px 0;
        }
        .hidden { display: none !important; }
        .engine-tip {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 6px;
        }
        .retry-hint {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 14px;
            color: #92400e;
        }
        .clean-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 30px;
            background: #dbeafe;
            color: #1e4a8a;
            margin-left: 8px;
        }
        .excel-section {
            background: #f0f4ff;
            border-radius: 16px;
            padding: 12px 16px;
            margin: 8px 0 4px;
            border: 1px solid #dbeafe;
        }
        .excel-section .excel-label {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .excel-section .excel-label i {
            color: #8b5cf6;
        }
        .excel-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .excel-btns .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .btn-sm-excel-import { background: #8b5cf6; color: white; }
        .btn-sm-excel-import:hover { background: #7c3aed; }
        .btn-sm-excel-export { background: #10b981; color: white; }
        .btn-sm-excel-export:hover { background: #059669; }
        .btn-sm-excel-export-all { background: #3b82f6; color: white; }
        .btn-sm-excel-export-all:hover { background: #2563eb; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success { background: #065f46; }
        .toast.error { background: #991b1b; }
        .toast.info { background: #1e4a8a; }
        .stats-badge {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="app-card">
    <h1><i class="fas fa-camera-retro"></i> 拍照搜题</h1>
    <div class="subhead"><i class="fas fa-cloud" style="margin-right: 6px; color: #3b82f6;"></i> 识别文字 · 直接显示答案 <span class="auto-answer-badge"><i class="fas fa-bolt"></i> 即识即答</span></div>

    <!-- 拍照/上传 -->
    <div class="upload-area">
        <i class="fas fa-image"></i>
        <div class="btn-group">
            <label for="camera-input" class="upload-btn"><i class="fas fa-camera"></i> 拍照</label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
            <label for="file-input" class="upload-btn upload-btn-outline"><i class="fas fa-folder-open"></i> 相册</label>
            <input type="file" id="file-input" accept="image/*" style="display:none;">
        </div>
        <div id="file-name-display" class="file-name">未选择文件</div>
        <div id="image-preview-container" class="image-preview">
            <span style="color: #94a3b8; padding: 16px; font-size: 14px;"><i class="fas fa-eye-slash"></i> 预览区</span>
        </div>
    </div>

    <!-- OCR 引擎选择 -->
    <div class="ocr-selector">
        <span style="font-size:14px; color:#475569; font-weight:500;">识别引擎：</span>
        <label><input type="radio" name="ocr-engine" value="youdao" checked> 有道智云</label>
        <label><input type="radio" name="ocr-engine" value="ocrspace"> OCR.space</label>
        <label><input type="radio" name="ocr-engine" value="tesseract"> Tesseract.js</label>
        <span class="engine-tip"><i class="fas fa-info-circle"></i> 推荐「有道智云」</span>
    </div>

    <!-- 按钮 -->
    <div class="action-row">
        <button class="btn btn-primary" id="recognize-btn"><i class="fas fa-search"></i> 识别题目</button>
        <button class="btn btn-success" id="solve-btn"><i class="fas fa-brain"></i> 手动解答</button>
        <button class="btn btn-outline" id="clear-btn"><i class="fas fa-undo-alt"></i> 清空</button>
    </div>

    <!-- Excel 导入导出 -->
    <div class="excel-section">
        <div class="excel-label"><i class="fas fa-file-excel"></i> 📊 题库管理 <span class="stats-badge" id="stats-badge">0 条</span></div>
        <div class="excel-btns">
            <label for="excel-input" class="btn-sm btn-sm-excel-import"><i class="fas fa-upload"></i> 导入Excel</label>
            <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" style="display:none;">
            <button class="btn-sm btn-sm-excel-export" id="export-selected-btn"><i class="fas fa-download"></i> 导出全部</button>
            <button class="btn-sm btn-sm-excel-export-all" id="export-template-btn"><i class="fas fa-file-alt"></i> 下载模板</button>
        </div>
        <div style="font-size:12px; color:#94a3b8; margin-top:6px;">
            <i class="fas fa-info-circle"></i> Excel格式：A列=关键词，B列=答案（支持多条关键词用 | 分隔）
        </div>
    </div>

    <!-- 自定义题目 -->
    <div class="custom-section">
        <label for="custom-text">
            <i class="fas fa-pen-fancy"></i> 
            题目 (可编辑)
            <span class="clean-badge"><i class="fas fa-eraser"></i> 自动去符号</span>
        </label>
        <textarea id="custom-text" class="custom-textarea" placeholder="在此输入或修改题目（自动去除标点符号）">床前明月光的下一句是什么</textarea>
    </div>

    <!-- 结果区域 -->
    <div class="result-box">
        <div class="label">
            <i class="fas fa-file-alt"></i> 
            识别结果 
            <span class="status-badge" id="status-badge">等待</span>
        </div>
        
        <div id="placeholder-content" class="placeholder-text">
            <i class="fas fa-lightbulb"></i> 识别后直接显示答案
        </div>
        
        <div id="answer-display" class="answer-display hidden">
            <div class="answer-label">
                <i class="fas fa-check-circle" style="color: #10b981;"></i>
                答案
                <span class="badge-answer status-badge" style="margin-left: auto;">已解答</span>
            </div>
            <div id="answer-text" class="answer-text"></div>
            <div class="question-ref">
                <strong>📝 识别题目：</strong>
                <span id="recognized-text-ref">-</span>
            </div>
            <div id="retry-hint" class="retry-hint hidden">
                <i class="fas fa-lightbulb"></i>
                <span id="retry-message"></span>
            </div>
        </div>
    </div>
    <div class="footer-note"><i class="fas fa-mobile-alt"></i> 支持Excel导入导出 · 识别后自动去符号</div>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast"></div>

<script>
(function() {
    // ---------- 有道智云 OCR 密钥 ----------
    const APP_KEY = '4e31d1ed9eb03607';
    const APP_SECRET = 'N7dGcr2X6sPlDCoPbsGBNnzJo6rAK25x';
    const YOUDAO_URL = 'https://openapi.youdao.com/ocr_general';
    const OCRSPACE_API_KEY = 'helloworld';

    // DOM
    const fileInput = document.getElementById('file-input');
    const cameraInput = document.getElementById('camera-input');
    const excelInput = document.getElementById('excel-input');
    const fileNameDisplay = document.getElementById('file-name-display');
    const previewContainer = document.getElementById('image-preview-container');
    const recognizeBtn = document.getElementById('recognize-btn');
    const solveBtn = document.getElementById('solve-btn');
    const clearBtn = document.getElementById('clear-btn');
    const exportSelectedBtn = document.getElementById('export-selected-btn');
    const exportTemplateBtn = document.getElementById('export-template-btn');
    const customText = document.getElementById('custom-text');
    const placeholderContent = document.getElementById('placeholder-content');
    const answerDisplay = document.getElementById('answer-display');
    const answerText = document.getElementById('answer-text');
    const recognizedTextRef = document.getElementById('recognized-text-ref');
    const statusBadge = document.getElementById('status-badge');
    const retryHint = document.getElementById('retry-hint');
    const retryMessage = document.getElementById('retry-message');
    const statsBadge = document.getElementById('stats-badge');
    const toast = document.getElementById('toast');
    const ocrRadios = document.querySelectorAll('input[name="ocr-engine"]');

    let currentFile = null;
    let currentQuestion = '';
    
    // ---------- 动态题库（支持导入导出） ----------
    let knowledgeBase = [
        { 
            keywords: ['床前明月光'], 
            answer: '✅ 下一句是：疑是地上霜' 
        },
        { 
            keywords: ['疑是地上霜'], 
            answer: '✅ 上一句是：床前明月光' 
        },
        { 
            keywords: ['举头望明月'], 
            answer: '✅ 下一句是：低头思故乡' 
        },
        { 
            keywords: ['低头思故乡'], 
            answer: '✅ 上一句是：举头望明月' 
        },
    ];

    // 更新统计
    function updateStats() {
        let total = 0;
        knowledgeBase.forEach(item => {
            total += item.keywords.length;
        });
        statsBadge.textContent = total + ' 条';
    }
    updateStats();

    // ---------- Toast 提示 ----------
    let toastTimer = null;
    function showToast(message, type = 'info', duration = 2500) {
        toast.textContent = message;
        toast.className = 'toast ' + type;
        setTimeout(() => toast.classList.add('show'), 10);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    // ---------- 工具函数 ----------
    function removeAllPunctuation(text) {
        return text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function normalizeText(text) {
        return removeAllPunctuation(text);
    }

    function updateStatus(text, type = 'info') {
        statusBadge.innerText = text;
        const styles = {
            loading: { bg: '#dbeafe', color: '#1e4a8a' },
            success: { bg: '#dcfce7', color: '#166534' },
            error: { bg: '#fee2e2', color: '#991b1b' },
            info: { bg: '#e9edf4', color: '#334155' }
        };
        const s = styles[type] || styles.info;
        statusBadge.style.background = s.bg;
        statusBadge.style.color = s.color;
    }

    function showAnswer(answer, recognizedText = '') {
        placeholderContent.classList.add('hidden');
        answerDisplay.classList.remove('hidden');
        answerText.textContent = answer;
        recognizedTextRef.textContent = recognizedText ? removeAllPunctuation(recognizedText) : (currentQuestion ? removeAllPunctuation(currentQuestion) : '-');
        retryHint.classList.add('hidden');
        updateStatus('已解答', 'success');
    }

    function showError(errorMsg, showRetrySuggestion = false) {
        placeholderContent.classList.add('hidden');
        answerDisplay.classList.remove('hidden');
        answerText.textContent = '❌ ' + errorMsg;
        answerText.style.color = '#b91c1c';
        recognizedTextRef.textContent = '-';
        if (showRetrySuggestion) {
            retryHint.classList.remove('hidden');
            retryMessage.textContent = '💡 建议切换到其他引擎重试，或直接在下方文本框中输入题目。';
        } else {
            retryHint.classList.add('hidden');
        }
        updateStatus('识别失败', 'error');
    }

    function resetAll() {
        currentFile = null;
        currentQuestion = '';
        fileInput.value = '';
        cameraInput.value = '';
        fileNameDisplay.innerText = '未选择文件';
        previewContainer.innerHTML = `<span style="color: #94a3b8; padding: 16px; font-size: 14px;"><i class="fas fa-eye-slash"></i> 预览区</span>`;
        placeholderContent.classList.remove('hidden');
        answerDisplay.classList.add('hidden');
        answerText.textContent = '';
        answerText.style.color = '';
        recognizedTextRef.textContent = '-';
        retryHint.classList.add('hidden');
        customText.value = '';
        updateStatus('等待', 'info');
    }

    function previewImage(file) {
        if (!file) {
            previewContainer.innerHTML = `<span style="color: #94a3b8; padding: 16px; font-size: 14px;"><i class="fas fa-eye-slash"></i> 预览区</span>`;
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            previewContainer.innerHTML = `<img src="${e.target.result}" alt="预览图片" style="max-width:100%; max-height:260px; border-radius:12px;">`;
        };
        reader.readAsDataURL(file);
    }

    function handleFileSelect(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('请选择图片文件');
            return;
        }
        currentFile = file;
        fileNameDisplay.innerText = file.name.length > 28 ? file.name.slice(0, 25) + '…' : file.name;
        previewImage(file);
        updateStatus('已选图片', 'info');
        placeholderContent.classList.remove('hidden');
        answerDisplay.classList.add('hidden');
        retryHint.classList.add('hidden');
    }

    // ---------- 📖 智能文字解答（优化版：优先匹配长关键词） ----------
    function smartTextSolve(question) {
        const q = normalizeText(question);
        if (!q) return null;

        // 构建关键词索引并按长度降序排序（长的优先匹配）
        const sortedEntries = [];
        for (let item of knowledgeBase) {
            for (let keyword of item.keywords) {
                const normKeyword = normalizeText(keyword);
                if (normKeyword) {
                    sortedEntries.push({
                        item: item,
                        keyword: normKeyword,
                        length: normKeyword.length
                    });
                }
            }
        }
        // 按关键词长度从长到短排序
        sortedEntries.sort((a, b) => b.length - a.length);

        // 第一轮：精确匹配（完全相同）
        for (let entry of sortedEntries) {
            if (q === entry.keyword) {
                return entry.item.answer;
            }
        }

        // 第二轮：包含匹配（检查 q 是否包含关键词）
        for (let entry of sortedEntries) {
            if (q.includes(entry.keyword)) {
                return entry.item.answer;
            }
        }

        // 第三轮：去除题目类型前缀后再匹配
        let cleanQ = q.replace(/^(单选题|多选题|判断题|选择题|填空题|简答题|论述题|计算题|问答题)/, '').trim();
        if (cleanQ && cleanQ !== q) {
            for (let entry of sortedEntries) {
                const coreKeyword = entry.keyword.replace(/^(单选题|多选题|判断题|选择题|填空题|简答题|论述题|计算题|问答题)/, '').trim();
                if (cleanQ.includes(coreKeyword) || (coreKeyword && cleanQ.includes(coreKeyword))) {
                    return entry.item.answer;
                }
            }
        }

        // 第四轮：模糊匹配（关键词包含在 q 中，但更宽松）
        for (let entry of sortedEntries) {
            // 如果关键词长度 >= 3，且 q 包含关键词的核心部分
            if (entry.length >= 3) {
                // 提取关键词中的核心部分（去除常见前缀）
                const core = entry.keyword.replace(/^(以下|关于|对于|所谓|一般|通常|基本|主要|重要|常见|典型)/, '').trim();
                if (core.length >= 2 && q.includes(core)) {
                    return entry.item.answer;
                }
            }
        }

        return null;
    }

    function autoSolveAndShow(question) {
        const cleanQuestion = removeAllPunctuation(question);
        if (!cleanQuestion) {
            showError('未能识别到有效题目');
            return;
        }
        currentQuestion = cleanQuestion;
        customText.value = cleanQuestion;
        let answer = smartTextSolve(cleanQuestion);
        if (!answer) {
            // 尝试用原始文本再匹配一次
            answer = smartTextSolve(question);
        }
        if (!answer) {
            answer = '🤔 暂未收录该题目的答案，可手动输入或尝试更完整的表述。';
        }
        showAnswer(answer, cleanQuestion);
    }

    function handleSolve() {
        const q = customText.value.trim();
        if (!q) { 
            alert('请先输入或识别题目'); 
            return; 
        }
        autoSolveAndShow(q);
    }

                { wch: 60 },

            ];

    // 导入 Excel
    function importFromExcel(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                if (!jsonData || jsonData.length === 0) {
                    showToast('❌ Excel 文件为空或格式不正确', 'error');
                    return;
                }
                
                // 解析数据：找关键词列和答案列
                const headers = Object.keys(jsonData[0]);
                let keywordCol = null;
                let answerCol = null;
                
                for (let h of headers) {
                    const lower = h.toLowerCase();
                    if (lower.includes('关键词') || lower.includes('题目') || lower.includes('keyword') || lower.includes('question')) {
                        keywordCol = h;
                    }
                    if (lower.includes('答案') || lower.includes('回答') || lower.includes('answer')) {
                        answerCol = h;
                    }
                }
                
                if (!keywordCol || !answerCol) {
                    showToast('❌ 未找到"关键词"和"答案"列，请检查Excel格式', 'error');
                    return;
                }
                
                let importedCount = 0;
                const newItems = [];
                
                jsonData.forEach(row => {
                    const keywordRaw = String(row[keywordCol] || '').trim();
                    const answerRaw = String(row[answerCol] || '').trim();
                    if (keywordRaw && answerRaw) {
                        // 支持用 | 分隔多个关键词
                        const keywords = keywordRaw.split('|').map(k => k.trim()).filter(k => k);
                        if (keywords.length > 0) {
                            newItems.push({
                                keywords: keywords,
                                answer: answerRaw
                            });
                            importedCount += keywords.length;
                        }
                    }
                });
                
                if (newItems.length === 0) {
                    showToast('❌ 未识别到有效数据，请检查格式', 'error');
                    return;
                }
                
                // 追加到题库（去重）
                let addedCount = 0;
                newItems.forEach(newItem => {
                    // 检查是否已存在相同的关键词组合
                    let exists = false;
                    for (let existing of knowledgeBase) {
                        if (existing.keywords.length === newItem.keywords.length &&
                            existing.keywords.every(k => newItem.keywords.includes(k)) &&
                            existing.answer === newItem.answer) {
                            exists = true;
                            break;
                        }
                    }
                    if (!exists) {
                        knowledgeBase.push(newItem);
                        addedCount += newItem.keywords.length;
                    }
                });
                
                updateStats();
                showToast(`✅ 导入成功！新增 ${addedCount} 条关键词 (共 ${importedCount} 条)`, 'success');
                
            } catch(err) {
                console.error('导入失败:', err);
                showToast('❌ 导入失败: ' + err.message, 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // ========== 🚀 OCR 引擎 ==========

    async function ocrYoudao(imageFile) {
        const base64Image = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result.split(',')[1]);
            reader.readAsDataURL(imageFile);
        });

        const salt = Date.now().toString();
        const curtime = Math.floor(Date.now() / 1000).toString();
        const signStr = APP_KEY + base64Image + salt + curtime + APP_SECRET;
        const encoder = new TextEncoder();
        const data = encoder.encode(signStr);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const sign = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        const formData = new FormData();
        formData.append('img', base64Image);
        formData.append('langType', 'zh-en');
        formData.append('detectType', '10012');
        formData.append('imageType', '1');
        formData.append('docType', 'json');
        formData.append('appKey', APP_KEY);
        formData.append('salt', salt);
        formData.append('curtime', curtime);
        formData.append('signType', 'v3');
        formData.append('sign', sign);

        const response = await fetch(YOUDAO_URL, { method: 'POST', body: formData });
        const result = await response.json();

        if (result.errorCode === '0' && result.Result?.regions) {
            const lines = [];
            result.Result.regions.forEach(region => {
                region.lines?.forEach(line => {
                    if (line.words?.length > 0) {
                        const wordText = line.words.map(w => w.word).join('');
                        if (wordText.trim()) lines.push(wordText.trim());
                    }
                });
            });
            return lines.join('\n');
        }
        throw new Error(result.msg || `有道错误码: ${result.errorCode}`);
    }

    async function ocrOcrspace(imageFile) {
        try {
            const base64Image = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                reader.readAsDataURL(imageFile);
            });

            const formData = new FormData();
            formData.append('base64Image', 'data:image/jpeg;base64,' + base64Image);
            formData.append('apikey', OCRSPACE_API_KEY);
            formData.append('language', 'chs');
            formData.append('OCREngine', '2');

            const response = await fetch('https://api.ocr.space/parse/image', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.OCRExitCode === 1 && result.ParsedResults?.length > 0) {
                const text = result.ParsedResults[0].ParsedText || '';
                if (text.trim()) return text.trim();
                throw new Error('未识别到文字');
            }
            if (result.ErrorMessage && result.ErrorMessage.includes('limit')) {
                throw new Error('OCR.space 今日免费调用次数已用完');
            }
            throw new Error(result.ErrorMessage || 'OCR.space识别失败');
        } catch (error) {
            if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                throw new Error('OCR.space 服务暂时不可用');
            }
            throw error;
        }
    }

    async function ocrTesseract(imageFile) {
        if (typeof Tesseract === 'undefined') {
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        const imageUrl = URL.createObjectURL(imageFile);
        try {
            const result = await Tesseract.recognize(imageUrl, 'chi_sim+eng', {
                logger: (m) => { if (m.status === 'recognizing text') updateStatus('识别中...', 'loading'); }
            });
            URL.revokeObjectURL(imageUrl);
            const text = result.data.text.trim();
            if (!text) throw new Error('未识别到文字');
            return text;
        } catch(e) {
            URL.revokeObjectURL(imageUrl);
            throw new Error('Tesseract识别失败: ' + e.message);
        }
    }

    // ---------- 主识别 ----------
    async function recognizeImage() {
        if (!currentFile) {
            const val = customText.value.trim();
            if (val) {
                autoSolveAndShow(val);
                return;
            }
            alert('请先拍照/选择图片，或在自定义题目中输入文字');
            return;
        }

        let engine = 'youdao';
        for (let radio of ocrRadios) {
            if (radio.checked) engine = radio.value;
        }

        updateStatus('识别中...', 'loading');

        try {
            let text = '';
            const fileCopy = currentFile;

            if (engine === 'youdao') {
                text = await ocrYoudao(fileCopy);
            } else if (engine === 'ocrspace') {
                text = await ocrOcrspace(fileCopy);
            } else if (engine === 'tesseract') {
                text = await ocrTesseract(fileCopy);
            }

            if (!text || text.length < 2) {
                if (engine === 'ocrspace') {
                    showError('未识别到文字，OCR.space可能已达今日调用上限', true);
                } else {
                    showError('未识别到文字，请尝试更清晰的图片');
                }
                return;
            }

            autoSolveAndShow(text);

        } catch (error) {
            console.error('识别错误:', error);
            let msg = error.message || '识别失败';
            if (engine === 'ocrspace' && (msg.includes('limit') || msg.includes('不可用'))) {
                showError(msg, true);
            } else if (engine === 'youdao' && msg.includes('错误码')) {
                showError(msg + ' 💡 建议切换到「Tesseract.js」引擎', true);
            } else {
                showError(msg, false);
            }
        }
    }
